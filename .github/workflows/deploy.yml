name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Mandatory gate 1: API unit suite ────────────────────────────────────────
  # Fails the run on any test failure, timeout, or command error. The five
  # intentional skips (homer integration + Gate Q real-AI) are unchanged.
  test-unit:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # prisma generate needs a datasource URL but does not connect; the unit
      # suite never touches a database (real-DB tests are excluded from this config).
      DATABASE_URL: postgresql://postgres@localhost:5432/ci_placeholder
      DIRECT_URL: postgresql://postgres@localhost:5432/ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @raivstream/database exec prisma generate --schema schema.prisma
      - name: API unit tests
        run: pnpm --filter @raivstream/api test

  # ── Mandatory gate 2: real-PostgreSQL integration suite ─────────────────────
  # Disposable, isolated PostgreSQL 17 service on :5433 (non-production, trust
  # auth, dedicated DB). The suite MUST NOT be allowed to pass via its
  # database-unreachable skip path, so a fail-closed preflight runs first and the
  # test output is rejected if it contains the skip marker.
  test-integration:
    name: API integration tests (real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: raivstream_phase6d_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d raivstream_phase6d_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5433/raivstream_phase6d_test
      DIRECT_URL: postgresql://postgres@localhost:5433/raivstream_phase6d_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @raivstream/database exec prisma generate --schema schema.prisma
      - name: Initialize disposable schema (prisma db push)
        run: pnpm --filter @raivstream/database exec prisma db push --schema schema.prisma --skip-generate
      - name: Apply Phase 6D partial unique index (20261009110000)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/migrations/20261009110000_phase6d_music_cue_lock/migration.sql
      - name: Fail-closed preflight (database reachable + intended index predicate)
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "SELECT 1" >/dev/null
          idx="$(psql "$DATABASE_URL" -tAc "SELECT indexdef FROM pg_indexes WHERE indexname='audio_cues_music_track_unique'")"
          if ! printf '%s' "$idx" | grep -qiE 'UNIQUE .*"trackId".*MUSIC_TRACK'; then
            echo "::error::audio_cues_music_track_unique missing or predicate wrong: ${idx:-<absent>}"
            exit 1
          fi
          echo "verified index: $idx"
      - name: Run integration suite (fail-closed; exact counts, zero skips)
        run: |
          set -euo pipefail
          pnpm --filter @raivstream/api test:integration --reporter=default --reporter=json --outputFile=/tmp/integration.json | tee /tmp/integration.log
          if grep -q "Test database not reachable" /tmp/integration.log; then
            echo "::error::Integration suite took the database-unreachable skip path — failing the job."
            exit 1
          fi
          node -e 'const r=require("/tmp/integration.json");const ok=r.numTotalTests===4&&r.numPassedTests===4&&r.numFailedTests===0&&r.numPendingTests===0&&r.numTodoTests===0;console.log("integration counts: total="+r.numTotalTests+" passed="+r.numPassedTests+" failed="+r.numFailedTests+" pending="+r.numPendingTests+" todo="+r.numTodoTests);if(!ok){console.error("::error:: integration suite did not run exactly 4 passing tests with zero failures/skips");process.exit(1);}'

  # ── Deployment — gated on BOTH test jobs ────────────────────────────────────
  deploy:
    name: Build & deploy web
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to VPS via SSH
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
          CI: "1"
        run: |
          set -euo pipefail

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          sed -i 's/\r//' /tmp/deploy_key
          trap 'rm -f /tmp/deploy_key' EXIT

          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o PasswordAuthentication=no \
            -p 22 \
            root@${{ secrets.SSH_HOST }} \
            'bash -s' <<'REMOTE_DEPLOY'
          set -euo pipefail

          if ! command -v flock >/dev/null 2>&1; then
            echo "flock is required for deployment locking but was not found on the VPS." >&2
            exit 1
          fi

          if ! flock -n /tmp/raivstream-deploy.lock bash <<'LOCKED_DEPLOY'
          set -euo pipefail

          cd /root/raivstream

          echo "==> Preserving runtime environment files..."
          env_backup_dir="$(mktemp -d)"
          trap 'rm -rf "$env_backup_dir"' EXIT
          for env_file in .env apps/web/.env.local packages/database/.env; do
            if [ -e "$env_file" ] || [ -L "$env_file" ]; then
              mkdir -p "$env_backup_dir/$(dirname "$env_file")"
              cp -a "$env_file" "$env_backup_dir/$env_file"
            fi
          done

          echo "==> Fetching and resetting to origin/main..."
          git fetch origin
          git reset --hard origin/main

          for env_file in .env apps/web/.env.local packages/database/.env; do
            if [ -e "$env_backup_dir/$env_file" ] || [ -L "$env_backup_dir/$env_file" ]; then
              mkdir -p "$(dirname "$env_file")"
              cp -a "$env_backup_dir/$env_file" "$env_file"
            fi
          done

          echo "==> Enabling pnpm 8.15.0 non-interactively..."
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          export CI=1
          corepack enable
          corepack prepare pnpm@8.15.0 --activate
          pnpm --version

          echo "==> Installing dependencies..."
          pnpm install --frozen-lockfile

          echo "==> Running database migrations and Prisma checks..."
          pnpm --filter @raivstream/database exec prisma migrate deploy
          pnpm --filter @raivstream/database exec prisma validate
          pnpm --filter @raivstream/database db:generate

          echo "==> Building web app into staging dir (.next-build)..."
          # Atomic deploy: build into .next-build while the running server keeps
          # serving the previous .next. tsc reads .next*/types, so web type-check
          # and lint must run against the SAME staging dir AFTER the build
          # regenerates those types (previously .next was rm -rf'd first, which
          # is what caused the chunk-400 window during every deploy).
          rm -rf apps/web/.next-build
          NEXT_BUILD_DIST_DIR=.next-build pnpm --filter @raivstream/web build

          echo "==> Running API and web validation against the fresh build..."
          pnpm --filter @raivstream/api type-check
          NEXT_BUILD_DIST_DIR=.next-build pnpm --filter @raivstream/web type-check
          NEXT_BUILD_DIST_DIR=.next-build pnpm --filter @raivstream/web lint --max-warnings=0

          echo "==> Atomic swap .next-build -> .next..."
          if [ -d apps/web/.next ]; then
            rm -rf apps/web/.next-old
            mv apps/web/.next apps/web/.next-old
          fi
          mv apps/web/.next-build apps/web/.next
          rm -rf apps/web/.next-old

          echo "==> Restarting PM2..."
          set -a; source apps/web/.env.local 2>/dev/null || true; set +a
          pm2 restart raivstream-web --update-env

          echo "==> Checking production health..."
          sleep 5
          curl --fail --silent --show-error https://app.raivstream.com/api/health
          curl --fail --silent --show-error https://r16.raivstream.com/api/health

          echo "Deployed commit: $(git rev-parse HEAD)"
          LOCKED_DEPLOY
          then
            echo "Another Raivstream deployment is already running; could not acquire /tmp/raivstream-deploy.lock." >&2
            exit 1
          fi
          REMOTE_DEPLOY
