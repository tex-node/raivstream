name: Deploy to VPS

on:
  push:
    branches: [main]

# Only one deploy runs at a time; a new push cancels the in-progress one
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            cd /root/raivstream

            echo "==> Pulling latest code..."
            git pull --ff-only

            echo "==> Installing dependencies..."
            pnpm install --frozen-lockfile

            echo "==> Regenerating Prisma client..."
            cd packages/database && pnpm exec prisma generate && cd /root/raivstream

            echo "==> Building web app..."
            pnpm --filter @raivstream/web build

            echo "==> Restarting PM2 process..."
            pm2 restart raivstream-web --update-env

            echo "==> Deploy complete ✅"
            pm2 list
