name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to VPS via SSH
        run: |
          # Write the private key to a temp file
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          # Strip any carriage returns that Windows/GitHub UI might have added
          sed -i 's/\r//' /tmp/deploy_key

          # Run deploy commands on the VPS
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o PasswordAuthentication=no \
            -p 22 \
            root@${{ secrets.SSH_HOST }} \
            "set -e
            cd /root/raivstream
            echo '==> Pulling latest code...'
            git pull --ff-only
            echo '==> Installing dependencies...'
            pnpm install --frozen-lockfile
            echo '==> Regenerating Prisma client...'
            cd packages/database && pnpm exec prisma generate && cd /root/raivstream
            echo '==> Running strict web lint...'
            pnpm --filter @raivstream/web lint --max-warnings=0
            echo '==> Building web app...'
            pnpm --filter @raivstream/web build
            echo '==> Restarting PM2...'
            pm2 restart raivstream-web --update-env
            echo '==> Done ✅'
            pm2 list"

          rm -f /tmp/deploy_key
